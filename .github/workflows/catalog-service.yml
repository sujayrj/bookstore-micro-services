name: Catalog Service CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'catalog-service/**'
      - '.mvn/**'
      - 'mvnw'
      - 'pom.xml'
      - '.github/workflows/catalog-service.yml'

  pull_request:
    paths:
      - 'catalog-service/**'
      - '.mvn/**'
      - 'mvnw'
      - 'pom.xml'
      - '.github/workflows/catalog-service.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./catalog-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            pom.xml
            catalog-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -ntp verify