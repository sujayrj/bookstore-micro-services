services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
      - ./init/catalog-db/01-create-catalog-db.sql:/docker-entrypoint-initdb.d/01-create-catalog-db.sql:ro
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 500m

volumes:
  catalog_db_data:
    name: catalog_db_data